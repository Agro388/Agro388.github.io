<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Feed - Black, Red & Gold</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0a0c',
                        cardBg: '#131217',
                        cardHover: '#1c1a22',
                        inputBg: '#0f0e13',
                        goldAccent: '#f59e0b',
                        goldHover: '#d97706',
                        goldLight: '#fde68a',
                        crimsonRed: '#dc2626',
                        darkRed: '#991b1b',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0c;
            color: #f3f4f6;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2430;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #dc2626;
        }
        .glow-gold {
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
        }
        .glow-red {
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex justify-center bg-darkBg antialiased selection:bg-crimsonRed selection:text-white">

    <div class="w-full max-w-md min-h-screen bg-darkBg border-x border-red-900/30 flex flex-col justify-between relative shadow-2xl">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-20 bg-darkBg/95 backdrop-blur-md border-b border-red-900/40 px-5 py-4 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-7 bg-gradient-to-b from-crimsonRed to-goldAccent rounded-full"></div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Home</h1>
            </div>
            <div class="flex items-center space-x-2">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-red-950/80 text-goldAccent border border-red-800/50">
                    <span class="w-2 h-2 rounded-full bg-crimsonRed mr-1.5 animate-pulse"></span>
                    Live Sync
                </span>
            </div>
        </header>

        <!-- FEED LIST CONTAINER -->
        <main id="feedList" class="flex-1 divide-y divide-zinc-800/60 pb-20 overflow-y-auto">
            <!-- Loading Indicator -->
            <div id="loadingState" class="p-12 text-center text-zinc-500">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-goldAccent mb-3"></i>
                <p class="text-sm">Connecting to global feed...</p>
            </div>
        </main>

        <!-- FLOATING ACTION BUTTON (+) -->
        <button id="openModalBtn" aria-label="Create New Post" 
            class="fixed bottom-6 right-1/2 translate-x-[170px] sm:translate-x-[180px] z-30 w-14 h-14 rounded-full bg-gradient-to-r from-crimsonRed to-goldAccent text-black flex items-center justify-center text-2xl shadow-lg hover:scale-105 active:scale-95 transition-all duration-200 glow-gold focus:outline-none">
            <i class="fa-solid fa-plus text-slate-950 font-black"></i>
        </button>

        <!-- POST COMPOSER MODAL / SLIDE-OVER -->
        <div id="postModal" class="fixed inset-0 z-50 flex justify-center items-end sm:items-center bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
            <div class="w-full max-w-md bg-cardBg border border-red-900/50 rounded-t-2xl sm:rounded-2xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="modalContainer">
                
                <!-- Modal Header -->
                <div class="p-4 border-b border-zinc-800/80 flex items-center justify-between bg-darkBg">
                    <button id="closeModalBtn" class="text-zinc-400 hover:text-white p-2 rounded-full hover:bg-zinc-800 transition-colors">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                    <span class="font-semibold text-zinc-300">New Global Post</span>
                    <button id="submitPostBtn" class="bg-gradient-to-r from-crimsonRed to-goldAccent text-black font-bold px-5 py-1.5 rounded-full hover:brightness-110 active:scale-95 transition-all shadow-md disabled:opacity-50 flex items-center">
                        <span id="submitBtnText">Post</span>
                        <i id="submitSpinner" class="fa-solid fa-circle-notch fa-spin ml-2 hidden"></i>
                    </button>
                </div>

                <!-- Modal Body Form -->
                <div class="p-5 overflow-y-auto space-y-5">
                    
                    <!-- User Avatar & Display Name Input -->
                    <div class="flex items-start space-x-3">
                        <div id="composerAvatar" class="w-12 h-12 rounded-full bg-gradient-to-br from-crimsonRed to-darkRed border border-goldAccent/40 flex items-center justify-center text-goldLight font-bold text-lg shadow-md shrink-0">
                            ?
                        </div>
                        <div class="flex-1">
                            <label class="block text-[11px] font-bold tracking-wider text-goldAccent uppercase mb-1">Display Name</label>
                            <input type="text" id="postAuthor" placeholder="Enter your name..." 
                                class="w-full bg-inputBg border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-goldAccent focus:ring-1 focus:ring-goldAccent transition-all placeholder:text-zinc-600">
                        </div>
                    </div>

                    <!-- Bold Title / Caption Input -->
                    <div>
                        <input type="text" id="postTitle" placeholder="Add a bold caption..." 
                            class="w-full bg-inputBg border border-zinc-800 rounded-xl px-4 py-3 text-goldLight font-semibold text-lg focus:outline-none focus:border-crimsonRed focus:ring-1 focus:ring-crimsonRed transition-all placeholder:text-zinc-600">
                    </div>

                    <!-- Content Textarea -->
                    <div>
                        <textarea id="postContent" rows="3" placeholder="What's on your mind? Write details here..." 
                            class="w-full bg-inputBg border border-zinc-800 rounded-xl p-4 text-zinc-200 focus:outline-none focus:border-goldAccent focus:ring-1 focus:ring-goldAccent transition-all placeholder:text-zinc-600 resize-none font-mono text-sm"></textarea>
                    </div>

                    <!-- Photo Attachment Section -->
                    <div class="bg-inputBg border border-zinc-800/80 rounded-2xl p-4 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-bold text-zinc-300">Photo</span>
                            <span class="text-xs text-zinc-500">Take picture / upload photo</span>
                        </div>
                        
                        <label class="flex items-center justify-center w-full px-4 py-3 border-2 border-dashed border-zinc-700 hover:border-goldAccent rounded-xl cursor-pointer bg-zinc-900/50 hover:bg-zinc-800/50 transition-all text-sm text-zinc-400 hover:text-goldAccent">
                            <i class="fa-solid fa-camera mr-2 text-crimsonRed"></i>
                            <span id="fileInputLabel">Choose Photo File</span>
                            <input type="file" id="postImageInput" accept="image/*" class="hidden">
                        </label>

                        <!-- Preview Area -->
                        <div id="imagePreviewContainer" class="hidden relative rounded-xl overflow-hidden border border-zinc-700 mt-2">
                            <img id="imagePreview" src="" alt="Preview" class="w-full max-h-48 object-cover">
                            <button id="removeImageBtn" type="button" class="absolute top-2 right-2 bg-black/70 hover:bg-crimsonRed text-white p-1.5 rounded-full backdrop-blur-sm transition-colors">
                                <i class="fa-solid fa-xmark w-4 h-4 flex items-center justify-center"></i>
                            </button>
                        </div>
                        <p class="text-[11px] text-zinc-500">On mobile devices this opens the camera directly.</p>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- Firebase Module Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase configuration environment resolution
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyDemoConfigKeyForGithubDeploymentOnly",
                authDomain: "demo-app.firebaseapp.com",
                projectId: "demo-app",
                storageBucket: "demo-app.appspot.com",
                messagingSenderId: "123456789",
                appId: "1:123456789:web:abcdef123456"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'global-social-feed';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State variables
        let currentUser = null;
        let currentImageData = null;

        // DOM Element References
        const feedList = document.getElementById('feedList');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const postModal = document.getElementById('postModal');
        const modalContainer = document.getElementById('modalContainer');
        const submitPostBtn = document.getElementById('submitPostBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const submitSpinner = document.getElementById('submitSpinner');

        const postAuthorInput = document.getElementById('postAuthor');
        const postTitleInput = document.getElementById('postTitle');
        const postContentInput = document.getElementById('postContent');
        const postImageInput = document.getElementById('postImageInput');
        const fileInputLabel = document.getElementById('fileInputLabel');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const composerAvatar = document.getElementById('composerAvatar');

        // Authentication Pre-flight Setup
        async function authenticateUser() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = userCredential.user;
                } else {
                    const userCredential = await signInAnonymously(auth);
                    currentUser = userCredential.user;
                }
            } catch (err) {
                console.warn("Authentication falling back to anonymous session:", err);
                try {
                    const userCredential = await signInAnonymously(auth);
                    currentUser = userCredential.user;
                } catch (e) {
                    console.error("Auth error:", e);
                }
            }
            if (currentUser) {
                subscribeToGlobalPosts();
            }
        }

        // Real-time listener for public posts
        function subscribeToGlobalPosts() {
            const postsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
            
            // Simple query without complex indexes
            onSnapshot(postsCollection, 
                (snapshot) => {
                    const posts = [];
                    snapshot.forEach((doc) => {
                        posts.push({ id: doc.id, ...doc.data() });
                    });

                    // Sort posts in memory by timestamp descending
                    posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                    renderFeed(posts);
                },
                (error) => {
                    console.error("Error listening to global posts:", error);
                    feedList.innerHTML = `
                        <div class="p-8 text-center text-red-400">
                            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                            <p class="text-sm">Unable to sync live feed. Please check network connection.</p>
                        </div>
                    `;
                }
            );
        }

        // Render posts list in DOM
        function renderFeed(posts) {
            feedList.innerHTML = '';

            if (!posts || posts.length === 0) {
                feedList.innerHTML = `
                    <div class="p-10 text-center text-zinc-500 my-auto">
                        <i class="fa-solid fa-paper-plane text-4xl mb-3 text-zinc-700"></i>
                        <p class="text-zinc-400 font-medium text-base mb-1">No posts yet</p>
                        <p class="text-xs text-zinc-600">Tap the <span class="text-goldAccent font-bold">+</span> button below to create the first post!</p>
                    </div>
                `;
                return;
            }

            posts.forEach(post => {
                const firstChar = post.author ? post.author.charAt(0).toUpperCase() : '?';
                const postEl = document.createElement('article');
                postEl.className = 'p-4 hover:bg-cardHover/60 transition-colors flex space-x-3.5 items-start relative group border-b border-zinc-800/40';

                postEl.innerHTML = `
                    <!-- Avatar Circle -->
                    <div class="w-11 h-11 rounded-full bg-gradient-to-br from-darkRed to-zinc-900 border border-goldAccent/50 flex items-center justify-center text-goldLight font-bold text-lg shadow-md shrink-0">
                        ${firstChar}
                    </div>

                    <!-- Post Content -->
                    <div class="flex-1 min-w-0 pr-2">
                        <div class="flex items-center space-x-2 text-sm mb-1">
                            <span class="font-bold text-white tracking-tight">${escapeHtml(post.author)}</span>
                            <span class="text-zinc-600 text-xs">•</span>
                            <span class="text-xs text-zinc-400 font-medium">${escapeHtml(post.timestamp)}</span>
                        </div>

                        ${post.title ? `
                            <h2 class="font-bold text-goldLight hover:text-goldAccent transition-colors text-base leading-snug mb-1 break-words">
                                ${escapeHtml(post.title)}
                            </h2>
                        ` : ''}

                        ${post.content ? `
                            <p class="text-zinc-300 text-sm leading-relaxed break-words font-normal">
                                ${escapeHtml(post.content)}
                            </p>
                        ` : ''}
                    </div>

                    <!-- Photo Thumbnail -->
                    ${post.imageUrl ? `
                        <div class="w-20 h-20 rounded-xl overflow-hidden bg-zinc-900 border border-zinc-800 shrink-0 shadow-sm self-center">
                            <img src="${post.imageUrl}" alt="Attachment" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/100x100/16141a/f59e0b?text=Image'">
                        </div>
                    ` : ''}
                `;

                feedList.appendChild(postEl);
            });
        }

        // Escape HTML for XSS safety
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function openModal() {
            postModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('translate-y-full');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalContainer.classList.add('translate-y-full');
            postModal.classList.add('opacity-0');
            setTimeout(() => {
                postModal.classList.add('pointer-events-none');
                document.body.style.overflow = '';
                resetForm();
            }, 250);
        }

        function resetForm() {
            postAuthorInput.value = '';
            postTitleInput.value = '';
            postContentInput.value = '';
            postImageInput.value = '';
            currentImageData = null;
            fileInputLabel.textContent = 'Choose Photo File';
            imagePreviewContainer.classList.add('hidden');
            composerAvatar.textContent = '?';
            submitPostBtn.disabled = false;
            submitBtnText.textContent = 'Post';
            submitSpinner.classList.add('hidden');
        }

        function getFormattedTimestamp() {
            const now = new Date();
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const month = months[now.getMonth()];
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${month} ${day}, ${hours}:${minutes}`;
        }

        // Compress / resize image before saving to Base64
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        function setupEventListeners() {
            openModalBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);

            postModal.addEventListener('click', (e) => {
                if (e.target === postModal) closeModal();
            });

            postAuthorInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                composerAvatar.textContent = val ? val.charAt(0).toUpperCase() : '?';
            });

            postImageInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    fileInputLabel.textContent = file.name;
                    try {
                        currentImageData = await compressImage(file);
                        imagePreview.src = currentImageData;
                        imagePreviewContainer.classList.remove('hidden');
                    } catch (err) {
                        console.error("Image compression error:", err);
                    }
                }
            });

            removeImageBtn.addEventListener('click', () => {
                postImageInput.value = '';
                currentImageData = null;
                fileInputLabel.textContent = 'Choose Photo File';
                imagePreviewContainer.classList.add('hidden');
            });

            // Save Post to Firestore
            submitPostBtn.addEventListener('click', async () => {
                if (!currentUser) {
                    alert('Connecting to live network... Please wait a moment.');
                    return;
                }

                const author = postAuthorInput.value.trim() || 'Anonymous';
                const title = postTitleInput.value.trim();
                const content = postContentInput.value.trim();

                if (!title && !content && !currentImageData) {
                    alert('Please enter a caption, message, or upload a photo.');
                    return;
                }

                // UI Loading state
                submitPostBtn.disabled = true;
                submitBtnText.textContent = 'Posting';
                submitSpinner.classList.remove('hidden');

                try {
                    const newPost = {
                        author: author,
                        title: title || '',
                        content: content || '',
                        imageUrl: currentImageData || null,
                        timestamp: getFormattedTimestamp(),
                        createdAt: Date.now(),
                        uid: currentUser.uid
                    };

                    const postsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                    await addDoc(postsCollection, newPost);

                    closeModal();
                } catch (err) {
                    console.error("Error creating global post:", err);
                    alert("Failed to publish post. Please try again.");
                    submitPostBtn.disabled = false;
                    submitBtnText.textContent = 'Post';
                    submitSpinner.classList.add('hidden');
                }
            });
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            authenticateUser();
        });
    </script>
</body>
</html>
