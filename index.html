<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Feed</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0b0c',
                        cardBg: '#131216',
                        cardHover: '#1a1921',
                        inputBg: '#0f0e13',
                        goldAccent: '#f59e0b',
                        goldHover: '#d97706',
                        goldLight: '#fde68a',
                        crimsonRed: '#dc2626',
                        darkRed: '#991b1b',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0c;
            color: #f3f4f6;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0b0c;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2430;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #dc2626;
        }
        .glow-gold {
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex justify-center bg-darkBg antialiased selection:bg-crimsonRed selection:text-white">

    <div class="w-full max-w-md min-h-screen bg-darkBg border-x border-red-900/30 flex flex-col justify-between relative shadow-2xl">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-20 bg-darkBg/95 backdrop-blur-md border-b border-red-900/40 px-5 py-4 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-7 bg-gradient-to-b from-crimsonRed via-red-600 to-goldAccent rounded-full shadow-sm"></div>
                <h1 class="text-2xl font-black tracking-tight text-white">Home</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button id="adminBtn" title="Toggle Admin Mode" class="text-zinc-500 hover:text-goldAccent p-2 rounded-full hover:bg-zinc-800/60 transition-colors">
                    <i class="fa-solid fa-shield-halved text-sm"></i>
                </button>
                <button id="refreshBtn" title="Refresh Feed" class="text-zinc-400 hover:text-goldAccent p-2 rounded-full hover:bg-zinc-800/60 transition-colors">
                    <i class="fa-solid fa-arrows-rotate text-sm"></i>
                </button>
                <span id="syncBadge" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-red-950/80 text-goldAccent border border-red-800/50">
                    <span class="w-2 h-2 rounded-full bg-crimsonRed mr-1.5 animate-pulse"></span>
                    <span id="syncText">Global Live</span>
                </span>
            </div>
        </header>

        <!-- FEED LIST CONTAINER -->
        <main id="feedList" class="flex-1 divide-y divide-zinc-800/50 pb-24 overflow-y-auto">
            <!-- Loading Indicator -->
            <div id="loadingState" class="p-12 text-center text-zinc-500">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-goldAccent mb-3"></i>
                <p class="text-sm">Connecting to global cloud feed...</p>
            </div>
        </main>

        <!-- FLOATING ACTION BUTTON (+) -->
        <button id="openModalBtn" aria-label="Create New Post" 
            class="fixed bottom-6 right-1/2 translate-x-[170px] sm:translate-x-[180px] z-30 w-14 h-14 rounded-full bg-gradient-to-r from-crimsonRed to-goldAccent text-black flex items-center justify-center text-2xl shadow-xl hover:scale-105 active:scale-95 transition-all duration-200 glow-gold focus:outline-none">
            <i class="fa-solid fa-plus text-slate-950 font-black"></i>
        </button>

        <!-- POST COMPOSER MODAL -->
        <div id="postModal" class="fixed inset-0 z-50 flex justify-center items-end sm:items-center bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
            <div class="w-full max-w-md bg-cardBg border border-red-900/50 rounded-t-2xl sm:rounded-2xl max-h-[92vh] flex flex-col shadow-2xl overflow-hidden transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="modalContainer">
                
                <div class="p-4 border-b border-zinc-800/80 flex items-center justify-between bg-darkBg">
                    <button id="closeModalBtn" class="text-zinc-400 hover:text-white p-2 rounded-full hover:bg-zinc-800 transition-colors">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                    <span class="font-bold text-zinc-200">New Global Post</span>
                    <button id="submitPostBtn" class="bg-gradient-to-r from-crimsonRed to-goldAccent text-black font-bold px-5 py-1.5 rounded-full hover:brightness-110 active:scale-95 transition-all shadow-md disabled:opacity-50 flex items-center">
                        <span id="submitBtnText">Post</span>
                        <i id="submitSpinner" class="fa-solid fa-circle-notch fa-spin ml-2 hidden"></i>
                    </button>
                </div>

                <div class="p-5 overflow-y-auto space-y-4">
                    <div class="flex items-start space-x-3">
                        <div id="composerAvatar" class="w-12 h-12 rounded-full bg-gradient-to-br from-crimsonRed to-darkRed border border-goldAccent/40 flex items-center justify-center text-goldLight font-bold text-lg shadow-md shrink-0">
                            ?
                        </div>
                        <div class="flex-1">
                            <label class="block text-[11px] font-bold tracking-wider text-goldAccent uppercase mb-1">Display Name</label>
                            <input type="text" id="postAuthor" placeholder="Enter display name..." 
                                class="w-full bg-inputBg border border-zinc-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-goldAccent focus:ring-1 focus:ring-goldAccent transition-all placeholder:text-zinc-600">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold tracking-wider text-goldAccent uppercase mb-1">Caption / Title</label>
                        <input type="text" id="postTitle" placeholder="Add a bold caption..." 
                            class="w-full bg-inputBg border border-zinc-800 rounded-xl px-4 py-2.5 text-goldLight font-semibold text-base focus:outline-none focus:border-crimsonRed focus:ring-1 focus:ring-crimsonRed transition-all placeholder:text-zinc-600">
                    </div>

                    <div>
                        <textarea id="postContent" rows="3" placeholder="Write description or details here..." 
                            class="w-full bg-inputBg border border-zinc-800 rounded-xl p-3.5 text-zinc-200 focus:outline-none focus:border-goldAccent focus:ring-1 focus:ring-goldAccent transition-all placeholder:text-zinc-600 resize-none text-sm"></textarea>
                    </div>

                    <div class="bg-inputBg border border-zinc-800/80 rounded-2xl p-4 space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-zinc-300">ATTACH PHOTO</span>
                            <span class="text-[11px] text-zinc-500">Camera or Gallery</span>
                        </div>
                        
                        <label class="flex items-center justify-center w-full px-4 py-3 border-2 border-dashed border-zinc-700 hover:border-goldAccent rounded-xl cursor-pointer bg-zinc-900/50 hover:bg-zinc-800/50 transition-all text-sm text-zinc-400 hover:text-goldAccent">
                            <i class="fa-solid fa-camera mr-2 text-crimsonRed"></i>
                            <span id="fileInputLabel">Take Photo / Upload</span>
                            <input type="file" id="postImageInput" accept="image/*" class="hidden">
                        </label>

                        <div id="imagePreviewContainer" class="hidden relative rounded-xl overflow-hidden border border-zinc-700 mt-2">
                            <img id="imagePreview" src="" alt="Preview" class="w-full max-h-48 object-cover">
                            <button id="removeImageBtn" type="button" class="absolute top-2 right-2 bg-black/80 hover:bg-crimsonRed text-white p-1.5 rounded-full backdrop-blur-sm transition-colors">
                                <i class="fa-solid fa-xmark w-4 h-4 flex items-center justify-center"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- LIGHTBOX MODAL -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4 cursor-pointer" onclick="closeLightbox()">
        <img id="lightboxImg" class="max-w-full max-h-full rounded-xl shadow-2xl object-contain border border-zinc-800" src="" alt="Enlarged View">
    </div>

    <script>
        // --- YOUR CONNECTED SUPABASE PROJECT ---
        const SUPABASE_URL = "https://lpnmkzlblxeztsgtihzd.supabase.co";
        const SUPABASE_KEY = "Sb_publishable_Kp5dbUU6i8RU_z30zzAKBw_jokrJSvA";
        const ADMIN_PASSWORD = "admin"; // Admin delete password

        // Initialize Supabase client using 'db' variable name to prevent naming collision
        const db = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // State & DOM elements
        let isAdminLoggedIn = false;
        let cachedPosts = [];
        let currentImageData = null;

        const feedList = document.getElementById('feedList');
        const refreshBtn = document.getElementById('refreshBtn');
        const adminBtn = document.getElementById('adminBtn');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const postModal = document.getElementById('postModal');
        const modalContainer = document.getElementById('modalContainer');
        const submitPostBtn = document.getElementById('submitPostBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const submitSpinner = document.getElementById('submitSpinner');
        const syncText = document.getElementById('syncText');

        const postAuthorInput = document.getElementById('postAuthor');
        const postTitleInput = document.getElementById('postTitle');
        const postContentInput = document.getElementById('postContent');
        const postImageInput = document.getElementById('postImageInput');
        const fileInputLabel = document.getElementById('fileInputLabel');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const composerAvatar = document.getElementById('composerAvatar');

        async function fetchGlobalPosts() {
            if (!db) return;
            try {
                if (syncText) syncText.textContent = "Syncing...";
                const { data, error } = await db
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                cachedPosts = data || [];
                renderFeed(cachedPosts);
                if (syncText) syncText.textContent = "Global Live";
            } catch (err) {
                console.error("Error fetching posts from Supabase:", err);
                if (syncText) syncText.textContent = "Sync Error";
            }
        }

        async function publishPostGlobally(newPost) {
            if (!db) return;
            try {
                if (syncText) syncText.textContent = "Saving...";
                const { error } = await db.from('posts').insert([
                    {
                        id: newPost.id,
                        author: newPost.author,
                        title: newPost.title,
                        content: newPost.content,
                        image_url: newPost.imageUrl,
                        timestamp: newPost.timestamp
                    }
                ]);

                if (error) throw error;
                await fetchGlobalPosts();
            } catch (err) {
                console.error("Error inserting post into Supabase:", err);
                alert("Failed to publish post: " + err.message);
            }
        }

        async function deletePost(postId) {
            if (!isAdminLoggedIn) return;
            if (!confirm("Are you sure you want to delete this post globally?")) return;

            try {
                const { error } = await db.from('posts').delete().eq('id', postId);
                if (error) throw error;
                await fetchGlobalPosts();
            } catch (err) {
                console.error("Error deleting post:", err);
                alert("Could not delete post.");
            }
        }

        function renderFeed(posts) {
            feedList.innerHTML = '';

            if (!posts || posts.length === 0) {
                feedList.innerHTML = `
                    <div class="p-12 text-center text-zinc-500 my-auto flex flex-col items-center justify-center min-h-[50vh]">
                        <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-goldAccent mb-4 shadow-inner">
                            <i class="fa-solid fa-paper-plane text-2xl"></i>
                        </div>
                        <p class="text-zinc-300 font-bold text-lg mb-1">No posts yet</p>
                        <p class="text-xs text-zinc-500 max-w-xs">Be the first to post! Tap the glowing <span class="text-goldAccent font-bold">+</span> button below to publish globally.</p>
                    </div>
                `;
                return;
            }

            posts.forEach(post => {
                const firstChar = post.author ? post.author.charAt(0).toUpperCase() : '?';
                const img = post.image_url || post.imageUrl;
                const postEl = document.createElement('article');
                postEl.className = 'p-4 hover:bg-cardHover/60 transition-colors flex space-x-3.5 items-start relative group border-b border-zinc-800/40';

                postEl.innerHTML = `
                    <div class="w-11 h-11 rounded-full bg-gradient-to-br from-darkRed to-zinc-900 border border-goldAccent/50 flex items-center justify-center text-goldLight font-bold text-lg shadow-md shrink-0">
                        ${firstChar}
                    </div>

                    <div class="flex-1 min-w-0 pr-2">
                        <div class="flex items-center space-x-2 text-sm mb-1">
                            <span class="font-bold text-white tracking-tight">${escapeHtml(post.author)}</span>
                            <span class="text-zinc-600 text-xs">•</span>
                            <span class="text-[11px] text-zinc-400 font-medium">${escapeHtml(post.timestamp)}</span>
                        </div>

                        ${post.title ? `<h2 class="font-bold text-goldLight hover:text-goldAccent transition-colors text-base leading-snug mb-1 break-words">${escapeHtml(post.title)}</h2>` : ''}
                        ${post.content ? `<p class="text-zinc-300 text-sm leading-relaxed break-words font-normal">${escapeHtml(post.content)}</p>` : ''}
                    </div>

                    ${img ? `
                        <div class="w-20 h-20 rounded-xl overflow-hidden bg-zinc-900 border border-zinc-800 shrink-0 shadow-sm self-center cursor-pointer" onclick="openLightbox('${img}')">
                            <img src="${img}" alt="Attachment" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        </div>
                    ` : ''}

                    ${isAdminLoggedIn ? `
                        <button onclick="deletePost('${post.id}')" title="Delete Post" class="text-zinc-600 hover:text-crimsonRed p-1 transition-colors">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    ` : ''}
                `;

                feedList.appendChild(postEl);
            });
        }

        function compressImage(file, maxWidth = 500, quality = 0.6) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) {
                            h = Math.round((h * maxWidth) / w);
                            w = maxWidth;
                        }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        function escapeHtml(t) {
            return (t || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function getFormattedTimestamp() {
            const now = new Date();
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${months[now.getMonth()]} ${String(now.getDate()).padStart(2, '0')}, ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function openModal() {
            postModal.classList.remove('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('translate-y-full');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalContainer.classList.add('translate-y-full');
            postModal.classList.add('opacity-0');
            setTimeout(() => {
                postModal.classList.add('pointer-events-none');
                document.body.style.overflow = '';
                resetForm();
            }, 250);
        }

        function resetForm() {
            postAuthorInput.value = ''; postTitleInput.value = ''; postContentInput.value = ''; postImageInput.value = '';
            currentImageData = null;
            fileInputLabel.textContent = 'Take Photo / Upload';
            imagePreviewContainer.classList.add('hidden');
            composerAvatar.textContent = '?';
            submitPostBtn.disabled = false;
            submitBtnText.textContent = 'Post';
            submitSpinner.classList.add('hidden');
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        function setupEventListeners() {
            openModalBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);
            postModal.addEventListener('click', (e) => { if (e.target === postModal) closeModal(); });

            adminBtn.addEventListener('click', () => {
                if (isAdminLoggedIn) {
                    isAdminLoggedIn = false;
                    adminBtn.classList.remove('text-crimsonRed');
                    adminBtn.classList.add('text-zinc-500');
                    alert("Admin mode disabled.");
                } else {
                    const pass = prompt("Enter Admin Password:");
                    if (pass === ADMIN_PASSWORD) {
                        isAdminLoggedIn = true;
                        adminBtn.classList.remove('text-zinc-500');
                        adminBtn.classList.add('text-crimsonRed');
                        alert("Admin mode activated. You can now delete posts.");
                    } else if (pass !== null) {
                        alert("Incorrect password.");
                    }
                }
                renderFeed(cachedPosts);
            });

            refreshBtn.addEventListener('click', () => {
                refreshBtn.classList.add('animate-spin');
                fetchGlobalPosts().then(() => {
                    setTimeout(() => refreshBtn.classList.remove('animate-spin'), 500);
                });
            });

            postAuthorInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                composerAvatar.textContent = val ? val.charAt(0).toUpperCase() : '?';
            });

            postImageInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    fileInputLabel.textContent = file.name;
                    currentImageData = await compressImage(file);
                    imagePreview.src = currentImageData;
                    imagePreviewContainer.classList.remove('hidden');
                }
            });

            removeImageBtn.addEventListener('click', () => {
                postImageInput.value = ''; currentImageData = null;
                fileInputLabel.textContent = 'Take Photo / Upload';
                imagePreviewContainer.classList.add('hidden');
            });

            submitPostBtn.addEventListener('click', async () => {
                const author = postAuthorInput.value.trim() || 'Anonymous';
                const title = postTitleInput.value.trim();
                const content = postContentInput.value.trim();

                if (!title && !content && !currentImageData) {
                    alert('Please write a caption or upload a photo.');
                    return;
                }

                submitPostBtn.disabled = true;
                submitBtnText.textContent = 'Publishing';
                submitSpinner.classList.remove('hidden');

                const newPost = {
                    id: Date.now().toString(),
                    author: author,
                    title: title || '',
                    content: content || '',
                    imageUrl: currentImageData || null,
                    timestamp: getFormattedTimestamp()
                };

                await publishPostGlobally(newPost);
                closeModal();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            fetchGlobalPosts();
            setInterval(fetchGlobalPosts, 8000); // Auto refresh every 8 seconds
        });
    </script>
</body>
</html>
