<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Hub | Work In Progress</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        position: relative;
        padding: 20px 0;
    }

    .hub-container {
        background: #121212;
        padding: 40px;
        border-radius: 14px;
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        text-align: center;
        width: 420px;
        max-width: 90%;
        animation: pulse-glow 3s infinite ease-in-out;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 15px;
        letter-spacing: 2px;
        font-size: 2rem;
        color: #ff2e2e;
        text-transform: uppercase;
    }

    .status {
        font-size: 1.1rem;
        color: #ffcc00;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 20px;
    }

    p {
        color: #aaa;
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0;
    }

    @keyframes pulse-glow {
        0% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); }
        50% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.6); }
        100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.3); }
    }
</style>
</head>

<body>

<div class="hub-container">
    <h1>System Hub</h1>
    <div class="status">⚠️ Work In Progress</div>
    <p>This page is currently under construction. Please check back later.</p>
</div>

</body>
</html>
